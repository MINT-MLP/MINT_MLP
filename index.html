    <!-- 카카오톡 인앱 브라우저 탈출 — 인앱 웹뷰의 상·하단 자체 UI(주소줄·툴바)는 웹에서 제거할 수 없으므로,
         감지되면 기본 브라우저(사파리/크롬)로 다시 열어 황금비율 UI가 눌리지 않게 한다.
         가장 먼저 실행해 깜빡임을 최소화. 세션당 1회만 시도(실패 시 무한 리다이렉트 방지). -->
    <script>
      (function () {
        try {
          var ua = (navigator.userAgent || '').toLowerCase();
          var inKakao = ua.indexOf('kakaotalk') !== -1;
          if (inKakao && !sessionStorage.getItem('mint_kakao_escaped')) {
            sessionStorage.setItem('mint_kakao_escaped', '1');
            var target = new URL(location.href);
            target.searchParams.set('from', 'kakao');
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(target.href);
          }
        } catch (e) { /* 무시하고 인앱에서 그대로 렌더 */ }
      })();
    </script>
    <!-- PWA 설치 프롬프트를 리액트(lazy 청크) 마운트 전에 미리 붙잡아 둔다.
         beforeinstallprompt는 페이지 로드 직후 한 번만 발화할 수 있어, 컴포넌트가
         뒤늦게 리스너를 붙이면 영영 놓친다. 여기서 잡아 window에 보관 → 리액트가 읽는다. -->
    <script>
      window.__mintInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__mintInstallPrompt = e;
        window.dispatchEvent(new Event('mint:installready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__mintInstallPrompt = null;
        window.dispatchEvent(new Event('mint:installed'));
      });
    </script>
