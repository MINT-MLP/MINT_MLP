name: Deploy to Vercel

# Vercel Hobby는 비공개 GitHub Organization 저장소의 Git 연동을 막는다.
# 대신 push마다 Vercel CLI로 배포를 올린다. 브랜치에 따라 대상 프로젝트가 갈린다.
#   main → 운영 프로젝트 (VERCEL_PROJECT_ID)      https://www.meetatmint.com
#   dev  → 개발 프로젝트 (VERCEL_DEV_PROJECT_ID)  https://mint-mlp-dev.vercel.app
# 둘 다 각 프로젝트의 프로덕션 슬롯에 올린다. 개발 프로젝트도 --prod로 올려야 주소가 고정된다.
#
# 필요한 Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, VERCEL_DEV_PROJECT_ID
# VERCEL_TOKEN은 Scope를 Full Account로 발급할 것. 팀 범위 토큰은 CLI의 계정 조회에서 거부된다.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# 브랜치별로 직렬화. dev 배포가 운영 배포를 기다리거나 막지 않는다.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 브랜치 → 배포 대상 결정. 이후 스텝은 전부 DEPLOY_TARGET / VERCEL_PROJECT_ID만 본다.
      - name: Resolve deploy target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            target=production
            project_id='${{ secrets.VERCEL_PROJECT_ID }}'
          else
            target=dev
            project_id='${{ secrets.VERCEL_DEV_PROJECT_ID }}'
          fi
          if [ -z "$project_id" ]; then
            echo "::error::VERCEL_PROJECT_ID / VERCEL_DEV_PROJECT_ID secret이 비어 있다 (target=$target)"
            exit 1
          fi
          echo "DEPLOY_TARGET=$target" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "deploy target: $target (branch ${{ github.ref_name }})"

      # Hobby 커밋 작성자 검사 통과용. 러너의 일회용 체크아웃에서 HEAD 커밋의 작성자만
      # 소유자 명의로 바꾼다. push하지 않으므로 원격 저장소 히스토리는 전혀 바뀌지 않는다.
      # 부작용: 커밋 해시가 바뀌므로 Vercel 배포 기록의 SHA가 GitHub에 없는 값이 된다.
      - name: Normalize commit author for Vercel Hobby check
        run: |
          git config user.name "wooyeoun"
          git config user.email "rladndus321@gmail.com"
          git commit --amend --no-edit --reset-author
          git log -1 --format='author now: %an <%ae>'

      # 개발 프로젝트에서는 cron을 돌리지 않는다. 같은 배치가 운영과 이중으로 돌면
      # 네이버 API 호출과 캐시 갱신이 중복된다. 러너 안의 vercel.json에서만 crons를 지운다.
      #
      # 색인 차단도 같이 건다. robots.txt는 두 프로젝트가 같은 파일을 배포하는데다,
      # 개발 프로젝트도 프리뷰가 아니라 프로덕션 배포라 Vercel이 noindex를 자동으로 붙이지 않는다.
      # 그대로 두면 운영과 같은 앱이 다른 도메인에 색인돼 검색 신호가 갈린다.
      # robots.txt를 Disallow로 막지는 않는다 — 크롤러가 아예 안 들어오면 noindex를 못 읽는다.
      - name: Strip cron jobs and block indexing (dev only)
        if: env.DEPLOY_TARGET == 'dev'
        run: |
          jq 'del(.crons)
              | .headers = ((.headers // []) + [{
                  "source": "/(.*)",
                  "headers": [{"key": "X-Robots-Tag", "value": "noindex, nofollow"}]
                }])' vercel.json > vercel.json.tmp && mv vercel.json.tmp vercel.json
          if [ "$(jq '.crons' vercel.json)" != "null" ]; then
            echo "::error::crons 제거 실패"
            exit 1
          fi
          if [ "$(jq -r '[.headers[].headers[] | select(.key == "X-Robots-Tag")] | length' vercel.json)" != "1" ]; then
            echo "::error::X-Robots-Tag 헤더 주입 실패"
            exit 1
          fi
          echo "crons removed, noindex header added for dev"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings and env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
