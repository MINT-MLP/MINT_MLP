name: Deploy to Vercel

# Vercel Hobby는 비공개 GitHub Organization 저장소의 Git 연동을 막는다.
# 대신 main push마다 Vercel CLI로 프로덕션 배포를 올린다.
# 필요한 Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# VERCEL_TOKEN은 Scope를 Full Account로 발급할 것. 팀 범위 토큰은 CLI의 계정 조회에서 거부된다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Hobby 커밋 작성자 검사 통과용. 러너의 일회용 체크아웃에서 HEAD 커밋의 작성자만
      # 소유자 명의로 바꾼다. push하지 않으므로 원격 저장소 히스토리는 전혀 바뀌지 않는다.
      # 부작용: 커밋 해시가 바뀌므로 Vercel 배포 기록의 SHA가 GitHub에 없는 값이 된다.
      - name: Normalize commit author for Vercel Hobby check
        run: |
          git config user.name "wooyeoun"
          git config user.email "rladndus321@gmail.com"
          git commit --amend --no-edit --reset-author
          git log -1 --format='author now: %an <%ae>'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings and env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
