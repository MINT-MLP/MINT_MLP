name: Deploy to Vercel

# Vercel Hobby는 비공개 GitHub Organization 저장소의 Git 연동을 막는다.
# 대신 main push마다 Vercel CLI로 프로덕션 배포를 올린다.
# 필요한 Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Diagnose token and IDs (temporary)
        run: |
          echo "ORG_ID length: ${#VERCEL_ORG_ID}  (expected 29)"
          echo "PROJECT_ID length: ${#VERCEL_PROJECT_ID}  (expected 32)"
          echo "ORG_ID prefix: ${VERCEL_ORG_ID:0:5}  PROJECT_ID prefix: ${VERCEL_PROJECT_ID:0:4}"
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }}
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel project ls --scope="$VERCEL_ORG_ID" --token=${{ secrets.VERCEL_TOKEN }} || true

      - name: Pull Vercel project settings and env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
